name: Release Tauri App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: # Allows you to trigger the build manually with a button!

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # 1. Windows Builder
          - platform: 'windows-latest'
            args: ''
          # 2. Linux Builder (Ubuntu, Debian, Fedora, Arch)
          - platform: 'ubuntu-22.04'
            args: ''
          # 3. macOS Universal Binary (Apple Silicon + Intel)
          - platform: 'macos-latest'
            args: '--target universal-apple-darwin'

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Add macOS Universal targets
        if: matrix.platform == 'macos-latest'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      # Required system libraries for WebKitGTK on Linux
      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install npm dependencies
        run: npm install

      - name: Build Tauri app and upload all release assets
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name || 'v1.0.1' }}
          releaseName: "Folio ${{ github.ref_name || 'v1.0.1' }}"
          args: ${{ matrix.args }}
          releaseDraft: false
          prerelease: false