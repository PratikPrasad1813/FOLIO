name: Release Tauri App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: # Allows you to trigger multi-platform installer builds manually

jobs:
  verify:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Verify lint, offline sync, local search, and desktop export
        env:
          NEXT_PUBLIC_FOLIO_API_URL: ${{ vars.NEXT_PUBLIC_FOLIO_API_URL }}
        run: |
          npm run lint
          npm run test:desktop-sync
          npx --yes tsx --test src/lib/desktop/local-search.test.ts src/lib/workspace-sync.test.ts
          npm run build:desktop

  release:
    needs: verify
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            artifact_name: 'folio-windows-installers'
            args: ''
            bundle_glob: |
              src-tauri/target/release/bundle/nsis/*.exe
              src-tauri/target/release/bundle/msi/*.msi
          - platform: 'ubuntu-22.04'
            artifact_name: 'folio-linux-installers'
            args: ''
            bundle_glob: |
              src-tauri/target/release/bundle/appimage/*.AppImage
              src-tauri/target/release/bundle/deb/*.deb
          - platform: 'macos-latest'
            artifact_name: 'folio-macos-installers'
            args: '--target universal-apple-darwin'
            bundle_glob: |
              src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
              src-tauri/target/universal-apple-darwin/release/bundle/macos/*.tar.gz

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust toolchain build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Add macOS Universal targets
        if: matrix.platform == 'macos-latest'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      # Required system libraries for WebKitGTK on Linux
      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install npm dependencies
        run: npm ci

      - name: Build Tauri app and publish release assets (on version tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEXT_PUBLIC_FOLIO_API_URL: ${{ vars.NEXT_PUBLIC_FOLIO_API_URL }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Folio ${{ github.ref_name }}"
          args: ${{ matrix.args }}
          releaseDraft: false
          prerelease: false

      - name: Build standalone installers (manual workflow_dispatch)
        if: "!startsWith(github.ref, 'refs/tags/v')"
        env:
          NEXT_PUBLIC_FOLIO_API_URL: ${{ vars.NEXT_PUBLIC_FOLIO_API_URL }}
        run: npx tauri build ${{ matrix.args }}

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.bundle_glob }}
          if-no-files-found: error