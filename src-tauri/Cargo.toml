[package]
# The package name becomes the program file name (folio.exe on Windows). It was
# "app" in older builds, which made the installer, Task Manager and antivirus
# tools show an unhelpful "app.exe". The installer hooks remove the old file.
name = "folio"
version = "1.2.0"
description = "Folio - a free, open-source workspace for projects, tasks, ideas and Folio AI (desktop app)"
authors = ["Folio"]
license = "MIT"
repository = "https://github.com/PratikPrasad1813/folio"
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.5", features = [] }
tauri-plugin-log = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
# Local-first storage: the SQLite workspace mirror (folio.db) used by the
# desktop data layer and the background sync engine.
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
